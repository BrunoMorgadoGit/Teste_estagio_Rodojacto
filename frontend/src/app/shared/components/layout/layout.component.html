<div class="layout-shell">
  <header class="app-header">
    <div class="brand">
      <img src="logocomnome.png" alt="Rodojacto" class="brand-logo" />
      <small class="brand-subtitle">Sistema de Gestão</small>
    </div>

    <nav class="menu">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/organizations" routerLinkActive="active">Organizações</a>
      <a routerLink="/collaborators" routerLinkActive="active">Colaboradores</a>
      <a routerLink="/devices" routerLinkActive="active">Dispositivos</a>
    </nav>

    @if (user(); as currentUser) {
      <div class="user-area">
        <div class="user-info">
          <strong class="user-name">{{ currentUser.fullName }}</strong>
          <span class="user-email">{{ currentUser.email }}</span>
        </div>
        <span class="badge user-badge" [class.manager]="currentUser.accessLevel === 'MANAGER'" [class.operator]="currentUser.accessLevel === 'OPERATOR'">
          {{ currentUser.accessLevel }}
        </span>
        <button type="button" class="ghost btn-secondary logout-button" (click)="logout()">Sair</button>
      </div>
    }
  </header>

  <main class="content">
    <app-alert-banner />
    <router-outlet />
  </main>
</div>
